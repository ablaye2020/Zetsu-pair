<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZETSU-MD - Pairing Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 20% 50%, #0a0000 0%, #000000 100%);
            color: #ff0000;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #ff0000;
            text-align: center;
            width: 450px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0000;
        }
        .subtitle {
            color: #ff4444;
            font-size: 12px;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            background: #1a1a1a;
            border: 1px solid #ff0000;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            text-align: center;
        }
        button {
            background: #ff0000;
            color: black;
            border: none;
            padding: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            border-radius: 8px;
        }
        button:hover {
            background: #cc0000;
        }
        #code {
            margin-top: 20px;
            padding: 15px;
            background: #0a0a0a;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #00ff00;
            display: none;
        }
        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: #660000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ ZETSU-MD ⚔️</h1>
        <div class="subtitle">PAIRING CODE - Connexion rapide</div>
        
        <input type="tel" id="numero" placeholder="📞 Ton numéro WhatsApp (+221XXXXXXXXX)">
        <button onclick="genererCode()">🔗 GÉNÉRER LE CODE</button>
        
        <div id="code">
            🔐 CODE À 8 CHIFFRES :<br>
            <span id="codeValue">00000000</span>
        </div>
        
        <div class="footer">"Le respect ne se demande pas" - JOYBOY</div>
    </div>

    <script>
        async function genererCode() {
            const numero = document.getElementById('numero').value.trim();
            if(!numero || numero.length < 10) {
                alert("❌ Numéro invalide ! Format: +221XXXXXXXXX");
                return;
            }
            
            document.getElementById('code').style.display = 'block';
            document.getElementById('codeValue').innerHTML = "Génération...";
            
            try {
                const response = await fetch('/api/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: numero })
                });
                const data = await response.json();
                if(data.code) {
                    document.getElementById('codeValue').innerHTML = data.code;
                } else {
                    document.getElementById('codeValue').innerHTML = "Erreur: " + (data.error || "réessaie");
                }
            } catch(e) {
                document.getElementById('codeValue').innerHTML = "⚠️ Serveur indisponible";
            }
        }
    </script>
</body>
</html>
